title: AWS Root Account Console Login
id: 685de6de-85e0-4253-a4d9-7889bed02013
status: experimental
description: Detects a console sign-in by the AWS root user, which should almost never happen in day-to-day work.
references:
  - https://attack.mitre.org/techniques/T1078/004/
author: Nousheen Fathima
date: 2026-10-17
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'signin.amazonaws.com'
    eventName: 'ConsoleLogin'
    userIdentity.type: 'Root'
  condition: selection
falsepositives:
  - Rare break-glass tasks that require root (billing, account closure)
level: high

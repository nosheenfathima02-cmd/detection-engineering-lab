title: AWS CloudTrail Logging Stopped or Deleted
id: f98a5cef-c03d-49a9-be86-59bcfdd6af33
status: experimental
description: Detects an attempt to blind defenders by stopping, deleting, or reconfiguring a CloudTrail trail.
references:
  - https://attack.mitre.org/techniques/T1562/008/
author: Nousheen Fathima
date: 2026-10-17
tags:
  - attack.defense-evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'cloudtrail.amazonaws.com'
    eventName:
      - 'StopLogging'
      - 'DeleteTrail'
      - 'UpdateTrail'
      - 'PutEventSelectors'
  condition: selection
falsepositives:
  - Planned trail changes by the cloud platform team
level: high
